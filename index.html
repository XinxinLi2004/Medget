<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>该吃药了 · 补剂管家</title>
<style>
  @font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-wght-normal.woff2') format('woff2')}
  :root{
    --bg:#f2f2f7;
    --card:rgba(255,255,255,.66);
    --sep:rgba(60,60,67,.12);
    --label:#1c1c1e;
    --label2:rgba(60,60,67,.6);
    --label3:rgba(60,60,67,.35);
    --blue:#007aff;  --blue-soft:rgba(0,122,255,.12);
    --green:#34c759; --green-soft:rgba(52,199,89,.14);
    --red:#ff3b30;   --red-soft:rgba(255,59,48,.12);
    --orange:#ff9500;--orange-soft:rgba(255,149,0,.14);
    --seg-bg:rgba(118,118,128,.12);
    --r:16px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --font-num:'Manrope',-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  .dark{
    --bg:#000; --card:rgba(44,44,46,.66); --sep:rgba(84,84,88,.5);
    --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --blue:#0a84ff;  --blue-soft:rgba(10,132,255,.26);
    --green:#30d158; --green-soft:rgba(48,209,88,.26);
    --red:#ff453a;   --red-soft:rgba(255,69,58,.26);
    --orange:#ff9f0a;--orange-soft:rgba(255,159,10,.26);
    --seg-bg:rgba(118,118,128,.24);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-kerning:normal;
    max-width:560px;margin:0 auto;min-height:100vh;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));transition:background .3s,color .3s}
  .bg-orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-orbs i{position:absolute;border-radius:50%;filter:blur(64px);transition:opacity .3s}
  .dark .bg-orbs i{opacity:.5}

  .nav{position:sticky;top:0;z-index:30;display:flex;align-items:flex-end;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:rgba(242,242,247,.72);
    -webkit-backdrop-filter:saturate(200%) blur(28px);backdrop-filter:saturate(200%) blur(28px);
    border-bottom:.5px solid rgba(60,60,67,.14);box-shadow:inset 0 -1px 0 rgba(255,255,255,.5)}
  .dark .nav{background:rgba(22,22,24,.72);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
  .nav h1{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.08}
  .nav .add{font-size:16px;color:var(--blue);background:none;border:0;cursor:pointer;
    font-family:var(--font);padding:6px 2px 6px 12px;font-weight:500;transition:opacity .15s}
  .nav .add:active{opacity:.45}
  main{padding:6px 16px 12px}
  main.view-enter{animation:fadeUp .32s var(--ease)}

  .card{background:var(--card);border-radius:var(--r);overflow:hidden;margin-top:14px;
    border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 8px 28px rgba(0,0,0,.05)}
  .dark .card{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 28px rgba(0,0,0,.3)}
  .card.first{margin-top:8px}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep)}
  .row:last-child{border-bottom:none}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:16px;font-weight:500}
  .row-sub{font-size:13px;color:var(--label2);margin-top:2px}
  .chev{color:rgba(60,60,67,.28);font-size:18px;flex:0 0 auto;margin-left:2px}
  .dark .chev{color:rgba(235,235,245,.3)}
  .sec-head{padding:22px 16px 8px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}

  .check{width:40px;height:40px;border-radius:50%;border:2px solid rgba(60,60,67,.22);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);
    cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .check svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;transform:scale(.4);transition:transform .4s var(--spring),opacity .2s}
  .check.done{background:var(--green);border-color:var(--green)}
  .check.done svg{opacity:1;transform:scale(1)}
  .check:active{transform:scale(.9)}

  .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:100px;line-height:1.3;white-space:nowrap}
  .tag.green{background:var(--green-soft);color:var(--green)}
  .tag.orange{background:var(--orange-soft);color:var(--orange)}
  .tag.red{background:var(--red-soft);color:var(--red)}
  .tag.blue{background:var(--blue-soft);color:var(--blue)}
  .tag.gray{background:rgba(60,60,67,.08);color:var(--label2)}

  .btn{appearance:none;border:0;cursor:pointer;font-family:var(--font);font-weight:600;
    font-size:16px;border-radius:14px;padding:14px 16px;background:var(--blue);color:#fff;
    text-align:center;transition:transform .12s var(--ease),opacity .15s,filter .15s}
  .btn:active{transform:scale(.97);filter:brightness(.94)}
  .btn:disabled{background:rgba(60,60,67,.18);color:rgba(255,255,255,.9);cursor:default}
  .btn.destructive{background:var(--red)}
  .btn.plain{background:none;color:var(--blue);font-size:15px;padding:8px}
  .btn.block{width:100%}
  .btn.block + .btn.block{margin-top:10px}

  .meter{height:6px;background:rgba(60,60,67,.1);border-radius:3px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:3px;transition:width .6s var(--ease)}
  .meter.blue i{background:var(--blue)} .meter.green i{background:var(--green)}
  .meter.orange i{background:var(--orange)} .meter.red i{background:var(--red)}
  .dim{display:flex;justify-content:space-between;font-size:13px;margin-top:12px}
  .dim b{font-weight:600;font-variant-numeric:tabular-nums}

  .num,.big-num,.rep-hero .num,.total-num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .big-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .big-num .unit{font-size:16px;font-weight:400;color:var(--label2);margin-left:2px;font-family:var(--font)}

  .empty{text-align:center;color:var(--label2);padding:60px 24px}
  .empty .glyph{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:rgba(60,60,67,.08);
    display:flex;align-items:center;justify-content:center;color:var(--label3);font-size:30px}
  .empty a{color:var(--blue);text-decoration:none}

  .rep-hero{display:flex;align-items:center;gap:18px;padding:20px 16px 16px}
  .rep-hero .num{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .rep-hero .meta{flex:1}
  .rep-hero .who{font-size:20px;font-weight:600}
  .rep-hero .what{font-size:13px;color:var(--label2);margin-top:3px}

  .tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:40;
    display:flex;background:rgba(249,249,249,.72);
    -webkit-backdrop-filter:saturate(200%) blur(28px);backdrop-filter:saturate(200%) blur(28px);
    border-top:.5px solid rgba(60,60,67,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    padding-bottom:env(safe-area-inset-bottom)}
  .dark .tabbar{background:rgba(22,22,24,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .tabbar button{flex:1;border:0;background:none;padding:8px 4px 7px;display:flex;
    flex-direction:column;align-items:center;gap:2px;color:rgba(60,60,67,.45);cursor:pointer;
    font-family:var(--font);font-size:10px;font-weight:500;transition:color .18s}
  .tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--blue)}

  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
    transition:opacity .28s var(--ease);z-index:50;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
    background:rgba(248,248,250,.85);
    -webkit-backdrop-filter:saturate(200%) blur(30px);backdrop-filter:saturate(200%) blur(30px);
    border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.6);
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .38s var(--ease);z-index:51}
  .dark .sheet{background:rgba(28,28,30,.85);border-top-color:rgba(255,255,255,.08)}
  .sheet.on{transform:translateY(0)}
  .sheet .grip{width:38px;height:5px;background:rgba(60,60,67,.2);border-radius:3px;margin:4px auto 12px}
  .sheet .x{position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;
    background:rgba(60,60,67,.08);color:var(--label2);border:0;cursor:pointer;font-size:15px;
    font-family:var(--font);line-height:1;transition:background .15s}
  .sheet .x:active{background:rgba(60,60,67,.15)}
  .sheet h2{font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.02em}

  .field{padding:2px 0}
  .field label{display:block;font-size:13px;color:var(--label2);margin:12px 16px 4px}
  .field input{width:100%;padding:12px 16px;border:none;border-top:.5px solid var(--sep);
    border-bottom:.5px solid var(--sep);font-size:16px;font-family:var(--font);
    background:rgba(255,255,255,.6);color:var(--label)}
  .dark .field input{background:rgba(60,60,67,.3)}
  .field input:focus{outline:none;background:rgba(255,255,255,.9)}
  .dark .field input:focus{background:rgba(60,60,67,.5)}
  .field:first-child label{margin-top:0}

  .seg{position:relative;display:flex;background:var(--seg-bg);border-radius:9px;padding:2px;margin:0 16px 12px}
  .seg .seg-thumb{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:7px;
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);
    transition:left .28s var(--ease),width .28s var(--ease)}
  .seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:13px;border-radius:7px;
    color:var(--label2);cursor:pointer;font-family:var(--font);transition:color .18s var(--ease);
    position:relative;z-index:1;white-space:nowrap}
  .seg button.on{color:var(--label);font-weight:600}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid var(--sep)}
  .switch{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.16);position:relative;
    flex:0 0 auto;cursor:pointer;transition:background .2s var(--ease)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s var(--ease)}
  .switch.on{background:var(--green)}
  .switch.on::after{left:22px}

  .nav-ico{background:none;border:0;cursor:pointer;color:var(--blue);padding:6px;border-radius:8px;transition:opacity .15s}
  .nav-ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
  .nav-ico:active{opacity:.45}

  .big-action{display:flex;align-items:center;gap:13px;width:100%;
    background:linear-gradient(135deg,#0a84ff,#007aff);color:#fff;border:0;border-radius:16px;
    padding:15px 16px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;
    text-align:left;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,122,255,.28);
    transition:transform .12s var(--ease),filter .15s}
  .big-action svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .big-action .sub{font-size:12px;font-weight:400;opacity:.88;margin-top:2px}
  .big-action:active{transform:scale(.97);filter:brightness(.94)}

  .scan-wrap{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
  .scan-wrap.on{display:flex}
  .scan-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff}
  .scan-top .t{font-size:16px;font-weight:600}
  .scan-top button{background:rgba(255,255,255,.22);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-family:var(--font)}
  .scan-body{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scan-body video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan-frame{position:relative;width:min(72vw,280px);aspect-ratio:1;border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 4000px rgba(0,0,0,.45)}
  .scan-frame::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--blue);box-shadow:0 0 12px var(--blue)}
  .scan-hint{position:relative;text-align:center;color:#fff;padding:14px 16px 24px;font-size:14px;line-height:1.5}

  .toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);
    background:rgba(28,28,30,.9);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;
    z-index:70;opacity:0;pointer-events:none;transition:all .28s var(--ease);max-width:84vw;text-align:center;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .ai-presets{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 10px}
  .ai-preset{background:var(--blue-soft);color:var(--blue);border:0;border-radius:100px;
    padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:opacity .15s}
  .ai-preset:active{opacity:.6}

  /* ============ 人体营养图 ============ */
  .human-card{padding:16px}
  .human-layout{display:flex;align-items:stretch;gap:8px}
  .human-col{flex:1;display:flex;flex-direction:column;gap:8px}
  .human-col.center{flex:0 0 108px;align-items:center;justify-content:center}
  .human{width:100%;height:auto;max-height:300px}
  .human .body{fill:rgba(0,122,255,.06);stroke:rgba(0,122,255,.5)}
  .human .line{stroke:rgba(0,122,255,.3);stroke-width:1}
  .nut{background:rgba(255,255,255,.5);border-radius:10px;padding:7px 9px;border:1px solid rgba(60,60,67,.08)}
  .dark .nut{background:rgba(60,60,67,.3)}
  .nut .n{font-size:11.5px;font-weight:600}
  .nut .v{font-size:10.5px;color:var(--label2);font-variant-numeric:tabular-nums;margin-top:1px}
  .nut .mini{height:3px;background:rgba(60,60,67,.1);border-radius:2px;overflow:hidden;margin-top:4px}
  .nut .mini i{display:block;height:100%;border-radius:2px}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--label2)}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-transparency: reduce){
    .nav,.tabbar,.sheet,.card{backdrop-filter:none;-webkit-backdrop-filter:none}
    .nav{background:#f2f2f7}.tabbar{background:#f9f9f9}.sheet{background:#f8f8fa}.card{background:#fff}
    .dark .nav{background:#161618}.dark .tabbar{background:#161618}.dark .sheet{background:#1c1c1e}.dark .card{background:#2c2c2e}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bg-orbs">
  <i style="width:280px;height:280px;background:rgba(0,122,255,.28);top:-80px;left:-60px"></i>
  <i style="width:240px;height:240px;background:rgba(90,200,250,.30);top:120px;right:-70px"></i>
  <i style="width:260px;height:260px;background:rgba(175,82,222,.18);top:420px;left:-90px"></i>
  <i style="width:220px;height:220px;background:rgba(255,149,0,.16);bottom:60px;right:-50px"></i>
  <i style="width:300px;height:300px;background:rgba(52,199,89,.14);bottom:-120px;left:20px"></i>
</div>

<div class="nav"><h1 id="navTitle">今日</h1>
  <div style="display:flex;align-items:center;gap:2px">
    <button class="nav-ico" data-goto="settings" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/><path d="M19.4 15a1.7 1.7 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.82-.33 1.7 1.7 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.51 1.7 1.7 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></button>
    <button class="add" id="addBtn" data-goto="add">添加</button>
  </div></div>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="4"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.6 14.3l2.4 2.4 4.4-4.4"/></svg><span class="tb">今日</span></button>
  <button data-v="stack"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/><circle cx="8.5" cy="12" r=".9"/><circle cx="15.5" cy="12" r=".9"/></svg><span class="tb">补剂</span></button>
  <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/><path d="M9 7.5h6"/></svg><span class="tb">知识库</span></button>
  <button data-v="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.3 8.6c-.4-.9-1.5-1.4-2.4-1.4-1.3 0-2.2.6-2.2 1.4 0 1.9 4.5 1 4.5 2.9 0 .8-.8 1.4-2.1 1.4-.9 0-2-.5-2.4-1.4"/><path d="M12 5.8v12.4"/></svg><span class="tb">花费</span></button>
  <button data-v="know"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.3c.8.6 1.3 1.5 1.3 2.7h5.4c0-1.2.5-2.1 1.3-2.7A6 6 0 0 0 12 3z"/></svg><span class="tb">知识</span></button>
</nav>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet"></div>

<div class="scan-wrap" id="scanWrap">
  <div class="scan-top"><span class="t" id="scanT">扫码识别</span><button id="scanClose">×</button></div>
  <div class="scan-body"><video id="scanVideo" playsinline muted></video><div class="scan-frame"></div></div>
  <div class="scan-hint" id="scanHint">将补剂条码对准取景框</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ i18n ============ */
const I18N = {

/* ============ 评分引擎 ============ */
function median(a){const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
const vp = l => l.price/l.serv;
function scoreOf(l, dosePerTake=1){
  const quality = {优:90,中:65,差:40}[l.form];
  const efficacy = {强:90,中:68,弱:45}[l.ev];
  const transparency = l.trans ? 85 : 50;
  const group = LIB.filter(x=>x.cat===l.cat);
  const base = group.length>1 ? group : LIB;
  const v = vp(l), med = median(base.map(vp));
  const value = v<=med ? 90 : v<=med*1.6 ? 65 : 45;
  const composite = Math.round(quality*.3 + efficacy*.3 + transparency*.2 + value*.2);
  const amt = l.ing.amt*dosePerTake;
  const dose = amt<l.ing.min ? "不足" : (l.ing.max && amt>l.ing.max ? "超标" : "达标");
  const band = composite>=85 ? "优秀" : composite>=70 ? "良好" : composite>=55 ? "一般" : "谨慎";
  return {quality, efficacy, transparency, value, composite, band, dose, amt};
}

function bodyChartHTML(){

    const r = RDA[n];

/* ============ 行为 ============ */
function take(uid){
  const s = state.stack.find(x=>x.uid===uid); if(!s) return;
  const d = today();
  if((s.history[d]||0)>=s.takes || s.remaining<=0) return;
  s.history[d]=(s.history[d]||0)+1;
  s.remaining=Math.max(0,s.remaining-1);
  if(s.ingName){
    if(!state.intake[d]) state.intake[d]={};
    state.intake[d][s.ingName]=(state.intake[d][s.ingName]||0)+s.amt*s.dose;
  }
  save(); viewToday();
}
function remove(uid){state.stack=state.stack.filter(x=>x.uid!==uid);save();closeSheet();viewStack();}

let remindTimer=null;
function notify(name){
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification(t("notifTitle"), {body:name}); }catch(e){}
  }
  toast(t("notifTitle")+"："+name);
}
function startReminderCheck(){
  if(remindTimer) clearInterval(remindTimer);
  remindTimer = setInterval(()=>{
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    const d = today();
    state.stack.forEach(s=>{
      if(s.remindAt && s.remindAt===hhmm && s.remaining>0){
        const taken = s.history[d]||0;
        if(taken < s.takes) notify(s.name);
      }
    });
  }, 20000);
}

  const themeBtn = tgt.closest("[data-theme]");

  const motionTgl = tgt.closest("[data-motion]");
  if(motionTgl){ toggleMotion(); return; }
  const exp = tgt.closest("[data-export]");
  if(exp){ exportData(); return; }
  const clr = tgt.closest("[data-clear]");
  if(clr){ clearData(); return; }
  const del = tgt.closest("[data-del]");
  if(del){ remove(del.dataset.del); return; }
  const takeBtn = tgt.closest("[data-take]");
  if(takeBtn){ take(takeBtn.dataset.take); return; }
  const saveBtn = tgt.closest("[data-save]");
  if(saveBtn){ saveStack(); return; }
  const start = tgt.closest("[data-start]");
  if(start){ const id=start.dataset.start; openConfig(id==="custom"?null:byId(id)); return; }
  const st = tgt.closest("[data-stack]");

  if(libEl){ const l=byId(libEl.dataset.lib); if(l) openSheet(`<button class="x" data-x>×</button><h2>${l.name}</h2>`+reportHTML(l,1)); return; }
  const el = tgt.closest("[data-goto]");
  if(el){
    e.preventDefault();
    const g = el.dataset.goto;
    if(g==="add") openPick();
    else if(g==="scan") startScan();
    else if(g==="photo") pickImage();
    else if(g==="settings") openSettings();
    return;
  }
});

function parseJSON(s){
  try{return JSON.parse(s);}catch(e){}
  const m = s.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){}}
  return null;
}
function normalizeLib(o){
  o = o||{};
  const ing = o.ing||{};
  return {
    id:"ai", name:o.name||"AI 识别补剂", fullName:o.fullName||o.name||"", brand:o.brand||"",
    storage:o.storage||"", cat:o.cat||"维生素",
    form:["优","中","差"].includes(o.form)?o.form:"中",
    ev:["强","中","弱"].includes(o.ev)?o.ev:"中", trans:true,
    ing:{name:ing.name||"成分", amt:+ing.amt||0, unit:ing.unit||"mg", min:+ing.min||0, max:+ing.max||0, ul:ing.ul?+ing.ul:undefined},
    good:o.good||"", bad:o.bad||"", note:o.note||"", price:+o.price||0, serv:+o.serv||60
  };
}
async function callAI(prompt, imageDataUrl){
  const c = getAI();
  if(!c.apiKey) throw new Error(t("needAIKey"));
  if(!c.baseUrl) throw new Error("Base URL");
  const content = [{type:"text", text:prompt}];
  if(imageDataUrl) content.push({type:"image_url", image_url:{url:imageDataUrl}});
  const res = await fetch(c.baseUrl.replace(/\/+$/,"")+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.apiKey},
    body: JSON.stringify({model:c.model||"gpt-4o-mini", messages:[{role:"user",content}], temperature:0.2})
  });
  if(!res.ok) throw new Error(t("aiHttp")+res.status+"）");
  const data = await res.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const text = msg ? msg.content : "";
  if(!text) throw new Error(t("aiNoResult"));
  return parseJSON(text);
}

/* ============ 拍照识别 ============ */
function fileToDataURL(f){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(f);});}
function pickImage(){
  if(!getAI().apiKey){ toast(t("needAIKey")); openSettings(); return; }
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.capture = "environment";
  input.onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    toast(t("aiRecognizing"));
    try{
      const lib = await callAI(AI_SCHEMA, await fileToDataURL(f));
      if(!lib) throw new Error(t("aiNoParse"));
      closeSheet(); openConfig(normalizeLib(lib));
    }catch(err){ toast(err.message||t("aiFail")); }
  };
  input.click();
}

/* ============ 扫码识别 ============ */
let scanStream=null, scanDetector=null;
function openScan(){ $("#scanWrap").classList.add("on"); }
function closeScan(){
  $("#scanWrap").classList.remove("on");
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  scanDetector=null;
}
$("#scanClose").addEventListener("click", closeScan);
async function startScan(){
  if(!("BarcodeDetector" in window)){ toast(t("noScan")); return; }
  closeSheet(); openScan();
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    $("#scanVideo").srcObject = scanStream;
    scanDetector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","qr_code"]});
    scanLoop();
  }catch(err){ closeScan(); toast(t("noCamera")+"："+(err.message||"")); }
}
function scanLoop(){
  if(!scanDetector) return;
  scanDetector.detect($("#scanVideo")).then(codes=>{
    if(codes && codes.length){ onCode(codes[0].rawValue); return; }
    requestAnimationFrame(scanLoop);
  }).catch(()=>requestAnimationFrame(scanLoop));
}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function queryOpenFoodFacts(code){
  const url = "https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+
    ".json?fields=product_name,product_name_zh,brands,categories,ingredients_text,quantity,image_front_url";
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  if(!data || !data.product) return null;
  return data.product;
}
let lastFound = null;
function onCode(code){
  closeScan();
  toast(t("querying"));
  queryOpenFoodFacts(code).then(product=>{
    if(product){
      lastFound = {
        name: product.product_name_zh || product.product_name || "未命名补剂",
        brand: product.brands || "",
        ing: product.ingredients_text || "",
        qty: product.quantity || ""
      };
      if(getAI().apiKey){
        toast(t("aiGen"));
        callAI(AI_SCHEMA+"\n以下是 Open Food Facts 查到的产品信息，据此生成 JSON：\n名称："+lastFound.name+"\n品牌："+lastFound.brand+"\n成分表："+(lastFound.ing||"（无）")+"\n规格："+(lastFound.qty||"（无）"), null)
        .then(lib=>{ if(lib){ openConfig(normalizeLib(lib)); return; } showOffFound(code); })
        .catch(()=>showOffFound(code));
        return;
      }
      showOffFound(code);
    } else {
      showNotFound(code);
    }
  }).catch(()=>showNotFound(code));
}
function showOffFound(code){
  const f = lastFound||{};
  openSheet(`<button class="x" data-x>×</button><h2>${t("foundProduct")}</h2>
    <div class="card" style="margin-top:12px">
      <div class="row"><div class="row-main"><div class="row-sub">${t("name")}</div><div class="row-title">${escapeHtml(f.name)}</div></div></div>
      ${f.brand?`<div class="row"><div class="row-main"><div class="row-sub">${t("brand")}</div><div class="row-title" style="font-size:15px">${escapeHtml(f.brand)}</div></div></div>`:""}
      ${f.ing?`<div class="row"><div class="row-main"><div class="row-sub">${t("ingredients")}</div><div class="row-title" style="font-size:13px;color:var(--label2);line-height:1.5">${escapeHtml(f.ing.slice(0,180))}${f.ing.length>180?"…":""}</div></div></div>`:""}
      <div class="row"><div class="row-main"><div class="row-sub">${t("barcode")}</div><div class="row-title" style="font-variant-numeric:tabular-nums">${code}</div></div></div>
    </div>
    <div class="row-sub" style="padding:8px 2px">${t("ofNote")}</div>
    <button class="btn block" style="margin-top:6px" data-ofedit>${t("completeSave")}</button>
    <button class="btn plain block" style="margin-top:4px" data-code="${code}">${t("aiFill")}</button>`);
}
function showNotFound(code){
  openSheet(`<button class="x" data-x>×</button><h2>${t("foundBarcode")}</h2>
    <div class="card" style="margin-top:12px"><div class="row"><div class="row-main">
      <div class="row-title" style="font-variant-numeric:tabular-nums">${code}</div>
      <div class="row-sub">${t("notFound")}</div></div></div></div>
    <button class="btn block" style="margin-top:16px" data-code="${code}">${t("aiFillInfo")}</button>
    <button class="btn plain block" style="margin-top:6px" data-manual>${t("manualAdd")}</button>`);
}
async function aiFromCode(code){
  toast(t("aiQuery"));
  try{
    const lib = await callAI(AI_SCHEMA+"\n用户提供的条码号："+code+"。条码通常无法精确反查产品，请基于常识给出最可能的补剂信息；若完全不确定则 name 填「未知补剂」。", null);
    if(!lib) throw new Error(t("aiNoParse"));
    closeSheet(); openConfig(normalizeLib(lib));
  }catch(err){ toast(err.message||t("aiFail")); }
}

/* ============ 设置 ============ */
function saveAI(){
  setAI({baseUrl:$("#ai_base").value.trim(), apiKey:$("#ai_key").value.trim(), model:$("#ai_model").value.trim()});
  toast(t("saved")); closeSheet();
}
function setLang(l){ settings.lang=l; lang=l; saveSettings(); applyLang(); views[curTab](); }
function setTheme(m){ settings.theme=m; saveSettings(); applyTheme(); }
function toggleMotion(){ settings.reduceMotion=!settings.reduceMotion; saveSettings(); applyReduceMotion(); }
function positionSegThumb(seg){
  const btns = seg.querySelectorAll("button");
  const thumb = seg.querySelector(".seg-thumb");
  if(!btns.length || !thumb) return;
  let idx = 0;
  btns.forEach((b,i)=>{ if(b.classList.contains("on")) idx=i; });
  const btn = btns[idx];
  if(btn.offsetWidth){
    thumb.style.left = btn.offsetLeft + "px";
    thumb.style.width = btn.offsetWidth + "px";
  }
}
function selectSeg(btn){
  const seg = btn.closest(".seg");
  seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===btn));
  positionSegThumb(seg);
}
function exportData(){
  const blob = new Blob([JSON.stringify({state, settings, ai:getAI()}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "gaichiyao-backup-"+today()+".json"; a.click();
  URL.revokeObjectURL(a.href);
}
function clearData(){
  localStorage.removeItem(KEY); localStorage.removeItem(AI_KEY);
  state.stack=[]; state.intake={}; save(); closeSheet(); toast(t("dataCleared")); setTab("today");
}
function openSettings(){
  const c = getAI();
  const presets = AI_PRESETS.map(p=>`<button class="ai-preset" data-preset='${JSON.stringify(p)}'>${p.name}</button>`).join("");
  const segLang = ["zh","en"].map(l=>`<button data-lang="${l}" class="${lang===l?"on":""}">${l==="zh"?"中文":"English"}</button>`).join("");
  const segTheme = ["auto","light","dark"].map(m=>`<button data-theme="${m}" class="${(settings.theme||"auto")===m?"on":""}">${t(m==="auto"?"followSystem":m)}</button>`).join("");
  openSheet(`<button class="x" data-x>×</button><h2>${t("settings")}</h2>
    <div class="sec-head" style="padding:12px 0 6px">${t("language")}</div><div class="seg">${segLang}<span class="seg-thumb"></span></div>
    <div class="sec-head" style="padding:8px 0 6px">${t("appearance")}</div><div class="seg">${segTheme}<span class="seg-thumb"></span></div>
    <div class="sec-head" style="padding:8px 0 0">${t("motion")}</div>
    <div class="switch-row"><span>${t("motionDesc")}</span><div class="switch ${settings.reduceMotion?"":"on"}" data-motion></div></div>
    <div class="sec-head" style="padding:8px 0 6px">${t("data")}</div>
    <div class="card"><div class="row"><div class="row-main"><div class="row-title" style="font-size:15px">${t("exportData")}</div></div><button class="btn plain" data-export>${t("exportData")}</button></div>
      <div class="row"><div class="row-main"><div class="row-title" style="font-size:15px;color:var(--red)">${t("clearData")}</div></div><button class="btn plain" data-clear style="color:var(--red)">${t("clearData")}</button></div></div>
    <div class="sec-head" style="padding:8px 0 6px">${t("aiSection")}</div>
    <div class="ai-presets">${presets}</div>
    <div class="field"><label>${t("baseUrl")}</label><input id="ai_base" value="${c.baseUrl||""}" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><label>${t("apiKey")}</label><input id="ai_key" type="password" value="${c.apiKey||""}" placeholder="sk-..."></div>
    <div class="field"><label>${t("model")}</label><input id="ai_model" value="${c.model||""}" placeholder="gpt-4o-mini / glm-4v-flash"></div>
    <button class="btn block" style="margin-top:8px" data-saveai>${t("saveAI")}</button>
    <div class="sec-head" style="padding:18px 0 6px">${t("about")}</div>
    <div class="card"><div class="row"><div class="row-main"><div class="row-sub" style="line-height:1.6">${t("disclaimer")}</div></div></div></div>`);
  requestAnimationFrame(()=>document.querySelectorAll(".seg").forEach(positionSegThumb));
}

applyTheme();
applyReduceMotion();
applyLang();
viewToday();
startReminderCheck();
</script>
