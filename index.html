<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>该吃药了 · 补剂管家</title>
<style>
  @font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-wght-normal.woff2') format('woff2')}
  :root{
    --bg:#f2f2f7;
    --card:rgba(248,248,250,.5);
    --sep:rgba(60,60,67,.12);
    --label:#1c1c1e;
    --label2:rgba(60,60,67,.6);
    --label3:rgba(60,60,67,.35);
    --blue:#007aff;  --blue-soft:rgba(0,122,255,.12);
    --green:#34c759; --green-soft:rgba(52,199,89,.14);
    --red:#ff3b30;   --red-soft:rgba(255,59,48,.12);
    --orange:#ff9500;--orange-soft:rgba(255,149,0,.14);
    --seg-bg:rgba(118,118,128,.12);
    --text:#1c1c1e;
    --purple:#af52de; --purple-soft:rgba(175,82,222,.16);
    --indigo:#5856d6; --indigo-soft:rgba(88,86,214,.16);
    --r:16px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --font-num:'Manrope',-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  .dark{
    --bg:#000; --card:rgba(44,44,46,.66); --sep:rgba(84,84,88,.5);
    --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --blue:#0a84ff;  --blue-soft:rgba(10,132,255,.26);
    --green:#30d158; --green-soft:rgba(48,209,88,.26);
    --red:#ff453a;   --red-soft:rgba(255,69,58,.26);
    --orange:#ff9f0a;--orange-soft:rgba(255,159,10,.26);
    --seg-bg:rgba(118,118,128,.24);
    --text:#fff;
    --purple:#bf5af2; --purple-soft:rgba(191,90,242,.24);
    --indigo:#5e5ce6; --indigo-soft:rgba(94,92,230,.24);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-kerning:normal;
    max-width:560px;margin:0 auto;min-height:100vh;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));transition:background .3s,color .3s}
  .bg-orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-orbs i{position:absolute;border-radius:50%;filter:blur(64px);transition:opacity .3s}
  .dark .bg-orbs i{opacity:.5}

  .nav{position:sticky;top:0;z-index:30;display:flex;align-items:flex-end;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:rgba(242,242,247,.72);
    -webkit-backdrop-filter:saturate(200%) blur(28px);backdrop-filter:saturate(200%) blur(28px);
    border-bottom:.5px solid rgba(60,60,67,.14);box-shadow:inset 0 -1px 0 rgba(255,255,255,.5)}
  .dark .nav{background:rgba(22,22,24,.72);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
  .nav h1{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.08}
  .nav .add{font-size:16px;color:var(--blue);background:none;border:0;cursor:pointer;
    font-family:var(--font);padding:6px 2px 6px 12px;font-weight:500;transition:opacity .15s}
  .nav .add:active{opacity:.45}
  main{padding:6px 16px 12px}
  main.view-enter{animation:fadeUp .32s var(--ease)}

  .card{background:var(--card);border-radius:var(--r);overflow:hidden;margin-top:14px;
    border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 8px 28px rgba(0,0,0,.05)}
  .dark .card{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 28px rgba(0,0,0,.3)}
  .card.first{margin-top:8px}
  .stack-card{display:flex;align-items:center;gap:14px;padding:12px;margin:10px 16px 0;border-radius:var(--r);
    background:var(--card);border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 8px 28px rgba(0,0,0,.05);cursor:pointer}
  .dark .stack-card{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 28px rgba(0,0,0,.3)}
  .stack-img{width:62px;height:62px;border-radius:13px;overflow:hidden;flex:0 0 auto;background:rgba(60,60,67,.05)}
  .stack-img img{width:100%;height:100%;object-fit:cover;display:block}
  .stack-info{flex:1;min-width:0}
  .stack-name{font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center}
  .stack-brand{font-size:12px;color:var(--label2);margin-top:1px}
  .stack-meta{font-size:12.5px;color:var(--label2);margin-top:3px;font-variant-numeric:tabular-nums}
  .bottle-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:rgba(0,122,255,.45);background:rgba(0,122,255,.05)}
  .bottle-ph svg{width:30px;height:42px}
  .bottle-ph span{font-size:13px;font-weight:700;margin-top:2px;color:var(--label2)}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep)}
  .row:last-child{border-bottom:none}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:16px;font-weight:500}
  .row-sub{font-size:13px;color:var(--label2);margin-top:2px}
  .chev{color:rgba(60,60,67,.28);font-size:18px;flex:0 0 auto;margin-left:2px}
  .dark .chev{color:rgba(235,235,245,.3)}
  .sec-head{padding:22px 16px 8px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}

  .check{width:40px;height:40px;border-radius:50%;border:2px solid rgba(60,60,67,.22);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);
    cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .check svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;transform:scale(.4);transition:transform .4s var(--spring),opacity .2s}
  .check.done{background:var(--green);border-color:var(--green);animation:checkGlow 1.1s var(--ease)}
  @keyframes checkGlow{0%{box-shadow:0 0 0 0 var(--green-soft)}100%{box-shadow:0 0 0 14px rgba(52,199,89,0)}}
  .check.done svg{opacity:1;transform:scale(1)}
  .check:active{transform:scale(.9)}

  .pill-icon{width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:rgba(60,60,67,.06)}
  .dark .pill-icon{background:rgba(255,255,255,.08)}
  .pill-icon svg{width:36px;height:36px}

  .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:100px;line-height:1.3;white-space:nowrap}
  .tag.green{background:var(--green-soft);color:var(--green)}
  .tag.orange{background:var(--orange-soft);color:var(--orange)}
  .tag.red{background:var(--red-soft);color:var(--red);animation:tagPulse 2.4s ease-in-out infinite}
  @keyframes tagPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}50%{box-shadow:0 0 0 5px rgba(255,59,48,.12)}}
  .tag.blue{background:var(--blue-soft);color:var(--blue)}
  .tag.gray{background:rgba(60,60,67,.08);color:var(--label2)}
  .func-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .ftag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;line-height:1;
    padding:4px 8px;border-radius:100px;white-space:nowrap;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .stack-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .ing-d{padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--card);
    -webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
    border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 20px rgba(0,0,0,.04)}
  .dark .ing-d{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 20px rgba(0,0,0,.25)}
  .ing-d-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .ing-d-h b{font-size:16px;font-weight:600;color:var(--text)}
  .ing-d-amt{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .ing-d-f{font-size:13px;margin-top:7px;color:var(--label)}
  .ing-d-f b{color:var(--text)}
  .ing-d-b{font-size:13px;margin-top:7px;color:var(--label2);line-height:1.5}
  .ing-d-n{font-size:12px;margin-top:6px;color:var(--label2);opacity:.85;line-height:1.45}
  .ing-d-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mat-chip{display:inline-flex;font-size:11px;font-weight:600;padding:2px 7px;border-radius:100px;margin-left:6px;white-space:nowrap}
  .mat-chip.green{background:var(--green-soft);color:var(--green)}
  .mat-chip.orange{background:var(--orange-soft);color:var(--orange)}
  .mat-chip.red{background:var(--red-soft);color:var(--red)}

  .btn{appearance:none;border:0;cursor:pointer;font-family:var(--font);font-weight:600;
    font-size:16px;border-radius:14px;padding:14px 16px;background:var(--blue);color:#fff;
    text-align:center;transition:transform .12s var(--ease),opacity .15s,filter .15s}
  .btn:active{transform:scale(.97);filter:brightness(.94)}
  .btn:disabled{background:rgba(60,60,67,.18);color:rgba(255,255,255,.9);cursor:default}
  .btn.destructive{background:var(--red)}
  .btn.plain{background:none;color:var(--blue);font-size:15px;padding:8px}
  .btn.plain.sm{font-size:13px;padding:6px 10px;border:1px solid var(--sep, rgba(0,0,0,.12));border-radius:8px}
  .btn.block{width:100%}
  .tag-on{display:inline-block;font-size:13px;font-weight:600;color:#fff;background:var(--green);padding:4px 10px;border-radius:8px}
  .btn.block + .btn.block{margin-top:10px}

  .meter{height:6px;background:rgba(60,60,67,.1);border-radius:3px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:3px;transition:width .6s var(--ease)}
  .meter.blue i{background:var(--blue)} .meter.green i{background:var(--green)}
  .meter.orange i{background:var(--orange)} .meter.red i{background:var(--red)}
  .dim{display:flex;justify-content:space-between;font-size:13px;margin-top:12px}
  .dim b{font-weight:600;font-variant-numeric:tabular-nums}

  .num,.big-num,.rep-hero .num,.total-num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .big-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .big-num .unit{font-size:16px;font-weight:400;color:var(--label2);margin-left:2px;font-family:var(--font)}

  .empty{text-align:center;color:var(--label2);padding:60px 24px}
  .empty .glyph{width:72px;height:72px;margin:0 auto 16px;border-radius:26px;
    background:linear-gradient(145deg,var(--card),rgba(118,118,128,.18));
    -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(60,60,67,.14);box-shadow:0 8px 24px rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:center;color:var(--label3);font-size:32px}
  .dark .empty .glyph{border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.3)}
  .empty a{color:var(--blue);text-decoration:none}

  .rep-hero{display:flex;align-items:center;gap:18px;padding:20px 16px 16px}
  .rep-hero .num{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .rep-hero .meta{flex:1}
  .rep-hero .who{font-size:20px;font-weight:600}
  .rep-hero .what{font-size:13px;color:var(--label2);margin-top:3px}

  .tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:40;
    display:flex;background:rgba(249,249,249,.72);
    -webkit-backdrop-filter:saturate(200%) blur(28px);backdrop-filter:saturate(200%) blur(28px);
    border-top:.5px solid rgba(60,60,67,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    padding-bottom:env(safe-area-inset-bottom)}
  .dark .tabbar{background:rgba(22,22,24,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .tabbar button{flex:1;border:0;background:none;padding:8px 4px 7px;display:flex;
    flex-direction:column;align-items:center;gap:2px;color:rgba(60,60,67,.45);cursor:pointer;
    font-family:var(--font);font-size:10px;font-weight:500;transition:color .18s}
  .tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--blue)}

  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
    transition:opacity .28s var(--ease);z-index:50;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;
    background:rgba(248,248,250,.85);
    -webkit-backdrop-filter:saturate(200%) blur(30px);backdrop-filter:saturate(200%) blur(30px);
    border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.6);
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .38s var(--ease);z-index:51}
  .dark .sheet{background:rgba(28,28,30,.85);border-top-color:rgba(255,255,255,.08)}
  .sheet.on{transform:translateY(0)}
  .sheet.full{top:0;bottom:0;height:100%;max-height:100%;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 12px)}
  .sheet.full .x{top:calc(env(safe-area-inset-top) + 10px)}
  html.noscroll, html.noscroll body{overflow:hidden;height:100%}
  .sheet .grip{width:38px;height:5px;background:rgba(60,60,67,.2);border-radius:3px;margin:4px auto 12px}
  .sheet .x{position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;
    background:rgba(60,60,67,.08);color:var(--label2);border:0;cursor:pointer;font-size:15px;
    font-family:var(--font);line-height:1;transition:background .15s}
  .sheet .x:active{background:rgba(60,60,67,.15)}
  .sheet h2{font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.02em}

  .field{padding:2px 0}
  .field label{display:block;font-size:13px;color:var(--label2);margin:12px 16px 4px}
  .field input{display:block;width:auto;margin:0 16px;padding:12px 14px;border:1px solid var(--sep);border-radius:12px;font-size:16px;font-family:var(--font);
    background:var(--card);color:var(--label);
    -webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
  .dark .field input{background:var(--card)}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 3px var(--blue-soft)}
  .dark .field input:focus{background:var(--card)}
  .field:first-child label{margin-top:0}

  .form-group{margin:14px 0 0;padding:6px 16px 14px;border-radius:var(--r);
    background:var(--card);border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 20px rgba(0,0,0,.04)}
  .dark .form-group{border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 20px rgba(0,0,0,.25)}
  .form-group > .sec-head{padding:14px 0 8px;font-size:13px;font-weight:600;color:var(--label2);text-transform:none;letter-spacing:0}
  .form-group .field{margin:0}
  .form-group .field label{margin:14px 0 4px}
  .form-group .field:first-child label{margin-top:2px}
  .form-group .field input{margin:0}
  .form-group .photo-row{padding:0}
  .form-group #ingList{margin:2px 0 0}

  .ing-row{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid rgba(60,60,67,.08)}
  .ing-row:first-child{border-top:0}
  .ing-line1,.ing-line2{display:flex;gap:8px;align-items:center;width:100%}
  .ing-row input,.ing-row select{border:1px solid var(--sep);border-radius:10px;padding:11px 10px;
    background:var(--card);color:var(--label);font-size:16px;font-family:var(--font);
    -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
  .dark .ing-row input,.dark .ing-row select{background:var(--card)}
  .ing-row .ing-name{flex:1;min-width:0}
  .ing-row .ing-amt{flex:1;min-width:0}
  .ing-row .ing-unit{flex:0 0 92px}
  .ing-row .ing-form{font-size:13px;color:var(--label);padding:9px 10px;border:1px solid var(--sep);border-radius:10px;
    background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .dark .ing-row .ing-form{background:var(--card)}
  .ing-row input:focus,.ing-row select:focus{outline:none;background:rgba(255,255,255,.55)}
  .dark .ing-row input:focus,.dark .ing-row select:focus{background:rgba(60,60,67,.5)}
  .ing-row .ing-del{flex:0 0 28px;height:28px;border:none;background:rgba(60,60,67,.08);color:var(--label2);
    border-radius:14px;font-size:16px;line-height:1;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
    transition:background .15s var(--ease),color .15s var(--ease)}
  .dark .ing-row .ing-del{background:rgba(255,255,255,.12)}
  .ing-row .ing-del:active{background:var(--red-soft);color:var(--red)}
  #ingList{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:2px 0 0}

  .pill-preview{display:flex;justify-content:center;padding:8px 0 2px}
  .pill-preview svg{width:72px;height:72px}
  .shape-row{display:flex;gap:8px;padding:6px 16px 2px;overflow-x:auto}
  .shape-opt{flex:0 0 auto;width:52px;height:52px;border-radius:13px;border:1.5px solid rgba(60,60,67,.12);
    background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s var(--ease)}
  .dark .shape-opt{background:rgba(60,60,67,.3)}
  .shape-opt svg{width:38px;height:38px}
  .shape-opt.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 10px var(--blue-soft)}
  .pp-label{font-size:12px;color:var(--label2);padding:10px 16px 6px}
  .color-row{display:flex;gap:10px;padding:2px 16px;flex-wrap:wrap}
  .color-opt{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s var(--ease)}
  .color-opt.on{transform:scale(1.15);border-color:var(--label);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 0 0 3px var(--blue-soft)}
  .detail-row{display:flex;gap:8px;padding:2px 16px 4px;flex-wrap:wrap}
  .detail-opt{font-size:13px;font-weight:500;padding:6px 14px;border-radius:100px;border:1px solid rgba(60,60,67,.15);
    background:rgba(255,255,255,.5);color:var(--label);cursor:pointer;transition:all .18s var(--ease)}
  .dark .detail-opt{background:rgba(60,60,67,.3)}
  .detail-opt.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .photo-row{display:flex;align-items:center;gap:12px;padding:0 16px}
  .photo-preview{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:0 0 auto;
    background:rgba(60,60,67,.06);display:flex;align-items:center;justify-content:center;
    border:1px dashed rgba(60,60,67,.18)}
  .photo-preview img{width:100%;height:100%;object-fit:cover}
  .ph-empty{font-size:11px;color:var(--label2);text-align:center;padding:4px}

  .seg{position:relative;display:flex;background:var(--seg-bg);border-radius:9px;padding:2px;margin:0 16px 12px}
  .seg .seg-thumb{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:7px;
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);
    transition:left .28s var(--ease),width .28s var(--ease)}
  .seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:13px;border-radius:7px;
    color:var(--label2);cursor:pointer;font-family:var(--font);transition:color .18s var(--ease);
    position:relative;z-index:1;white-space:nowrap}
  .seg button.on{color:var(--label);font-weight:600}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid var(--sep)}
  .switch{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.16);position:relative;
    flex:0 0 auto;cursor:pointer;transition:background .2s var(--ease)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s var(--ease)}
  .switch.on{background:var(--green)}
  .switch.on::after{left:22px}

  .nav-ico{background:none;border:0;cursor:pointer;color:var(--blue);padding:6px;border-radius:8px;transition:opacity .15s}
  .nav-ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
  .nav-ico:active{opacity:.45}

  .big-action{display:flex;align-items:center;gap:13px;width:100%;
    background:linear-gradient(135deg,#0a84ff,#007aff);color:#fff;border:0;border-radius:16px;
    padding:15px 16px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;
    text-align:left;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,122,255,.28);
    transition:transform .12s var(--ease),filter .15s}
  .big-action svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .big-action .sub{font-size:12px;font-weight:400;opacity:.88;margin-top:2px}
  .big-action:active{transform:scale(.97);filter:brightness(.94)}

  .scan-wrap{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
  .scan-wrap.on{display:flex}
  .scan-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff}
  .scan-top .t{font-size:16px;font-weight:600}
  .scan-top button{background:rgba(255,255,255,.22);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-family:var(--font)}
  .scan-body{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scan-body video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan-frame{position:relative;width:min(72vw,280px);aspect-ratio:1;border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 4000px rgba(0,0,0,.45)}
  .scan-frame::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--blue);box-shadow:0 0 12px var(--blue)}
  .scan-hint{position:relative;text-align:center;color:#fff;padding:14px 16px 24px;font-size:14px;line-height:1.5}

  /* 原生扫码：让 WebView 透明，露出插件相机预览 */
  html.scanner-active, html.scanner-active body{background:transparent!important}
  html.scanner-active .scan-wrap{background:transparent}
  html.scanner-active .scan-top, html.scanner-active .scan-hint{background:rgba(0,0,0,.45)}
  html.scanner-active .scan-body video{display:none}
  /* 扫码锁底层：无论原生/Web 路径，均隐藏 #view / #tabbar / 弹层，只保留扫码层，避免其他界面漏出 */
  html.scan-locked #view,
  html.scan-locked #tabbar,
  html.scan-locked .sheet-mask,
  html.scan-locked .sheet{visibility:hidden;pointer-events:none}

  .toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);
    background:rgba(28,28,30,.9);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;
    z-index:70;opacity:0;pointer-events:none;transition:all .28s var(--ease);max-width:84vw;text-align:center;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ AI 等待加载层 ============ */
  .ai-loading{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
  .ai-loading.on{opacity:1;pointer-events:auto}
  .dark .ai-loading{background:rgba(0,0,0,.62)}
  .ai-loading .sp{width:48px;height:48px;border-radius:50%;border:4px solid rgba(0,122,255,.16);
    border-top-color:var(--blue);animation:aiload-spin .8s linear infinite}
  @keyframes aiload-spin{to{transform:rotate(360deg)}}
  .ai-loading .lt{margin-top:18px;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .ai-loading .ls{margin-top:6px;font-size:13px;color:var(--label2);text-align:center;padding:0 36px;line-height:1.45}

  .ai-presets{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 10px}
  .ai-preset{background:var(--blue-soft);color:var(--blue);border:0;border-radius:100px;
    padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:opacity .15s}
  .ai-preset:active{opacity:.6}

  /* ============ 人体营养图 ============ */

  .human-center{display:flex;justify-content:center;padding:8px 0 6px}

    -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    background:var(--label);opacity:.55}
  .dark .human-mask{opacity:.45}
  .nut-row{padding:11px 0;border-bottom:.5px solid var(--sep)}
  .nut-row:last-of-type{border-bottom:none}
  .nut-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .nut-name{font-size:15px;font-weight:500;color:var(--label)}
  .nut-val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--label2);white-space:nowrap}
  .nut-val b{font-size:15px;font-weight:700}
  .nut-val em{font-style:normal;font-size:12px;color:var(--label2)}
  .nut-bar{height:4px;background:rgba(60,60,67,.1);border-radius:2px;margin-top:7px;overflow:hidden}
  .nut-bar i{display:block;height:100%;border-radius:2px;transition:width .6s var(--ease)}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:11px;color:var(--label2)}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ============ 日历 + 连续天数 ============ */
  .streak-card{display:flex;align-items:center;gap:16px;padding:16px}
  .streak-num{font-family:var(--font-num);font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .streak-num .unit{font-size:14px;font-weight:500;color:var(--label2);margin-left:2px;font-family:var(--font)}
  .streak-meta{flex:1}
  .streak-label{font-size:13px;color:var(--label2)}
  .streak-sub{font-size:15px;font-weight:600;margin-top:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px 14px}
  .cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--label3);position:relative;background:rgba(60,60,67,.06)}
  .dark .cal-day{background:rgba(255,255,255,.06)}
  .cal-day.done{background:var(--green-soft);color:var(--green)}
  .cal-day.partial{background:var(--orange-soft);color:var(--orange)}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--blue), 0 0 0 4px var(--blue-soft)}
  .cal-day.future{opacity:.4}
  .cal-day.blank{background:transparent}
  .cal-day[data-calday]{cursor:pointer}
  .cal-day.blank{cursor:default}
  .cal-bar{display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
  .cal-title{font-size:16px;font-weight:700;letter-spacing:-.01em;flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .cal-nav{width:32px;height:32px;border-radius:50%;border:0;background:rgba(60,60,67,.08);color:var(--label);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
    font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);transition:opacity .15s}
  .dark .cal-nav{background:rgba(255,255,255,.1)}
  .cal-nav:active{opacity:.5}
  .cal-today{border:0;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:100px;cursor:pointer;font-family:var(--font);transition:opacity .15s;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .cal-today:active{opacity:.5}
  .cal-daylist{margin:4px 0 2px}
  .cal-daylist .row{padding:10px 16px}
  .cal-done-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .cal-done-dot.ok{background:var(--green)}
  .cal-done-dot.no{background:var(--orange)}

  /* ============ 7 天趋势柱状图 ============ */
  .trend-row{display:flex;align-items:flex-end;gap:8px;padding:8px 16px 14px;height:90px}
  .trend-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .trend-bar .bar{width:100%;border-radius:7px 7px 4px 4px;min-height:4px;transition:height .5s var(--ease);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .trend-bar .bar.full{background:var(--green)}
  .trend-bar .bar.partial{background:var(--orange)}
  .trend-bar .bar.none{background:rgba(60,60,67,.12)}
  .dark .trend-bar .bar.none{background:rgba(255,255,255,.1)}
  .trend-bar .lbl{font-size:10px;color:var(--label3);font-weight:600}
  .trend-bar .pct{font-size:10px;color:var(--label2);font-variant-numeric:tabular-nums}

  /* ============ 相互作用卡片（液态玻璃 callout） ============ */
  .ia-card{position:relative;padding:12px 15px;border-radius:var(--r);margin:8px 16px 0;display:flex;gap:10px;align-items:flex-start;
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 4px 16px rgba(0,0,0,.05)}
  .ia-card.warn{background:rgba(255,149,0,.14);border:1px solid rgba(255,149,0,.28)}
  .ia-card.good{background:rgba(52,199,89,.14);border:1px solid rgba(52,199,89,.28)}
  .ia-card.info{background:rgba(0,122,255,.14);border:1px solid rgba(0,122,255,.28)}
  .dark .ia-card.warn{background:rgba(255,159,10,.22);border-color:rgba(255,159,10,.42)}
  .dark .ia-card.good{background:rgba(48,209,88,.22);border-color:rgba(48,209,88,.42)}
  .dark .ia-card.info{background:rgba(10,132,255,.22);border-color:rgba(10,132,255,.42)}
  .ia-ico{font-size:18px;flex:0 0 auto;line-height:1.2}
  .ia-body{flex:1;min-width:0}
  .ia-title{font-size:13px;font-weight:700;margin-bottom:2px}
  .ia-msg{font-size:12px;color:var(--label2);line-height:1.4}
  .ia-card.warn .ia-title{color:var(--orange)}
  .ia-card.good .ia-title{color:var(--green)}
  .ia-card.info .ia-title{color:var(--blue)}

  /* ============ 时段分组 ============ */
  .slot-head{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
  .slot-head .dot{width:8px;height:8px;border-radius:50%}
  .slot-head .dot.morning{background:var(--orange)}
  .slot-head .dot.noon{background:var(--blue)}
  .slot-head .dot.evening{background:var(--purple,#AF52DE)}
  .slot-head .dot.bed{background:var(--indigo,#5856D6)}
  .slot-head span{font-size:13px;font-weight:600;color:var(--label2)}
  .slot-head .slot-cnt{font-size:12px;color:var(--label3);margin-left:auto}

  @media (prefers-reduced-transparency: reduce){
    .nav,.tabbar,.sheet,.card,.ia-card,.lib-search,.ing-row input,.ing-row select,.ing-row .ing-form,.ing-d{backdrop-filter:none;-webkit-backdrop-filter:none}
    .nav{background:#f2f2f7}.tabbar{background:#f9f9f9}.sheet{background:#f8f8fa}.card{background:#fff}
    .dark .nav{background:#161618}.dark .tabbar{background:#161618}.dark .sheet{background:#1c1c1e}.dark .card{background:#2c2c2e}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* 安卓 WebView 等不渲染 backdrop-filter 的环境：玻璃退化为实色浅灰表面，彻底消除白块 */
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))){
    :root{ --card: rgba(228,228,233,1); }
    .dark{ --card: rgba(28,28,30,.96); }
    *{ -webkit-backdrop-filter:none!important; backdrop-filter:none!important; }
    .card,.stack-card,.ing-d,.field,.field input,.ing-row input,.ing-row select{ border-color:rgba(60,60,67,.14)!important; }
    .card,.stack-card,.ing-d{ box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05)!important; }

/* ============ 主题 ============ */
function applyTheme(){
  const m = settings.theme||"auto";
  const dark = m==="dark" || (m==="auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark?"#000":"#f2f2f7");
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{if(settings.theme==="auto")applyTheme();});
function applyReduceMotion(){
  const red = settings.reduceMotion;
  document.documentElement.style.setProperty("--ease", red?"linear":"cubic-bezier(.32,.72,0,1)");
  document.documentElement.style.setProperty("--spring", red?"linear":"cubic-bezier(.34,1.56,.64,1)");
}

function checkInteractions(){
  const names = [];
  state.stack.forEach(s=>{
    (s.ings||[]).forEach(g=>{ if(g.name) names.push(g.name); });
  });
  const found = [];
  const seen = new Set();
  INTERACTIONS.forEach(rule=>{
    const hasA = names.some(n=>n.includes(rule.a) || rule.a.includes(n));
    const hasB = names.some(n=>n.includes(rule.b) || rule.b.includes(n));
    if(hasA && hasB){
      const key = [rule.a,rule.b].sort().join("+");
      if(!seen.has(key)){ seen.add(key); found.push(rule); }
    }
  });
  return found;
}

  const ings = (s.ings||[]).map(g=>g.name);
  const has = kw => ings.some(n=>n.includes(kw));
  if(has("镁") || has("益生菌") || has("褪黑")) return "bed";

  if(has("维生素 D") || has("维生素 K") || has("维生素 A") || has("鱼油") || has("EPA") || has("DHA") || has("辅酶")) return "noon";
  if(has("维生素 B") || has("维生素 C")) return "morning";
  if(has("肌酸") || has("蛋白")) return "morning";
  if(s.usage === "bed") return "bed";
  if(s.usage === "empty") return "morning";
  if(s.usage === "meal") return "noon";
  return "noon";
}

/* ============ 药丸 3D 渲染 ============ */
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(amt>=0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=(1+amt); g*=(1+amt); b*=(1+amt); }
  const f=v=>Math.max(0,Math.min(255,Math.round(v)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function pillIconOf(icon){

function ingInfo(name){ return INGREDIENT_INFO[name] || null; }
// 由补剂成分汇总功能标签
function funcTagsOf(s){
  const set = new Set();
  getIngs(s).forEach(g=>{ const info = ingInfo(g.name); if(info && info.func) info.func.forEach(f=>set.add(f)); });
  return [...set];
}
// 综合评价：真实原料形态评分（活性/高吸收形式加分，低吸收/高负担减分）
function formQualityOf(s){
  let score = 0, n = 0;
  getIngs(s).forEach(g=>{
    const info = ingInfo(g.name); if(!info || !info.forms || !info.forms.length) return;
    const fm = info.forms.find(f=>f.name===g.form) || info.forms[0];
    n++;
    if(fm.absorb==="高") score += 10; else if(fm.absorb==="中") score += 4;
    if(fm.burden==="低") score += 4; else if(fm.burden==="高") score -= 4;
  });
  return n? Math.round(60 + score/n*2) : null; // 60~约84 区间
}


/* ============ 评分引擎 ============ */
function median(a){const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
const vp = l => l.price/l.serv;
const _libGroups = (()=>{ const g={}; LIB.forEach(l=>{(g[l.cat]||(g[l.cat]=[])).push(l);}); return g; })();
function scoreOf(l, dosePerTake=1){
  if(dosePerTake===1 && l._score) return l._score;
  const quality = ({优:90,良:75,中:65,差:40}[l.form]) ?? 65;
  const efficacy = ({强:90,中:68,弱:45}[l.ev]) ?? 68;
  const transparency = l.trans ? 85 : 50;
  const group = _libGroups[l.cat] || LIB;
  const base = group.length>1 ? group : LIB;
  const v = vp(l), med = median(base.map(vp));
  const value = v<=med ? 90 : v<=med*1.6 ? 65 : 45;
  const composite = Math.round(quality*.3 + efficacy*.3 + transparency*.2 + value*.2);
  const amt = l.ing.amt*dosePerTake;
  const dose = amt<l.ing.min ? "不足" : (l.ing.max && amt>l.ing.max ? "超标" : "达标");
  const band = composite>=85 ? "优秀" : composite>=70 ? "良好" : composite>=55 ? "一般" : "谨慎";
  const r = {quality, efficacy, transparency, value, composite, band, dose, amt};
  if(dosePerTake===1) l._score = r;
  return r;
}
const bandTag = b => b==="优秀"||b==="良好" ? "green" : b==="一般" ? "orange" : "red";
const bandColor = b => b==="优秀"||b==="良好" ? "green" : b==="一般" ? "orange" : "red";
const bandLabel = b => ({优秀:t("bExcellent"),良好:t("bGood"),一般:t("bFair"),谨慎:t("bCaution")})[b];

/* ============ 页面：今日 ============ */
function calcStreak(){
  let streak = 0;
  const d = new Date();
  // 如果今天还没完成，从昨天开始算
  const todayDone = state.stack.length > 0 && state.stack.every(s=>((s.history[today()]||0)>=s.takes||s.remaining<=0));
  if(!todayDone) d.setDate(d.getDate()-1);
  while(true){
    const ds = d.toISOString().slice(0,10);
    const allDone = state.stack.length > 0 && state.stack.every(s=>((s.history[ds]||0)>=s.takes||s.remaining<=0));
    if(allDone) streak++;
    else break;
    d.setDate(d.getDate()-1);
    if(streak > 365) break;
  }
  return streak;
}
let calY = null, calM = null;
function ensureCal(){
  if(calY === null){ const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }
}
function calendarHTML(){
  ensureCal();
  const y = calY, m = calM;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7; // 周一为一周首日
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = today();
  const dows = ["一","二","三","四","五","六","日"];
  const dowHTML = dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const cells = [];
  for(let i = 0; i < startDow; i++) cells.push(`<div class="cal-day blank"></div>`);
  for(let d = 1; d <= daysInMonth; d++){
    const ds = new Date(y, m, d).toISOString().slice(0,10);
    const isFuture = ds > todayStr;
    const isToday = ds === todayStr;
    let cls = "";
    if(isToday) cls = "today";
    if(!isFuture && state.stack.length > 0){
      const doneCount = state.stack.filter(s=>((s.history[ds]||0)>=s.takes || s.remaining<=0)).length;
      const ratio = doneCount / state.stack.length;
      if(ratio >= 1) cls = "done" + (isToday ? " today" : "");
      else if(ratio > 0) cls = "partial" + (isToday ? " today" : "");
    }
    if(isFuture) cls = (cls ? cls + " " : "") + "future";
    cells.push(`<div class="cal-day ${cls.trim()}" data-calday="${ds}">${d}</div>`);
  }
  while(cells.length % 7 !== 0) cells.push(`<div class="cal-day blank"></div>`);
  return `<div class="cal-grid">${dowHTML}${cells.join("")}</div>`;
}
function renderCal(){

  if(title) title.textContent = calY + "年" + (calM + 1) + "月";

function trendHTML(){

const capLN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
async function scheduleNativeReminder(name, remindAt){
  const LN = capLN(); if(!LN) return;
  try{
    const perm = await LN.requestPermissions();
    if(!perm || perm.display !== 'granted'){ toast(t("notifPerm")); return; }
    const p = remindAt.split(':').map(Number);
    const next = new Date();
    next.setHours(p[0]||0, p[1]||0, 0, 0);
    if(next.getTime() <= Date.now()) next.setDate(next.getDate()+1);
    await LN.schedule({ notifications: [{
      id: Math.floor(Date.now()/1000) % 1000000000,
      title: t("notifTitle"),
      body: name,
      schedule: { at: next, every: 'day' }
    }]});
  }catch(e){}
}
function saveUsage(uid){
  const s = state.stack.find(x=>x.uid===uid); if(!s) return;
  const active = document.querySelector("[data-usage].on");
  if(active) s.usage = active.dataset.usage;
  s.remindAt = $("#f_remind").value || "";
  save();
  if(s.remindAt){
    if(capLN()) scheduleNativeReminder(s.name, s.remindAt);
    else if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
  }
  closeSheet(); setTab(curTab);
}

let tmpPhoto = "";
function compressImage(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ 行为 ============ */
function take(uid){
  const s = state.stack.find(x=>x.uid===uid); if(!s) return;
  const d = today();
  if((s.history[d]||0)>=s.takes || s.remaining<=0) return;
  s.history[d]=(s.history[d]||0)+1;
  s.remaining=Math.max(0,s.remaining-(s.dose||1));
  (s.ings||[]).forEach(g=>{
    if(g && g.name && g.amt>0){
      if(!state.intake[d]) state.intake[d]={};
      state.intake[d][g.name]=(state.intake[d][g.name]||0)+g.amt*s.dose;
    }
  });
  save(); viewToday();
}
// 重新计算全部「每日摄入」：按各补剂的 s.history × 当前 s.ings 整日重建。
// 采用整日重建而非增量加减，避免改名/改量/改剂量时旧 key 残留导致「今日」重复显示或错归类。
// 仅重建有打卡记录的日期；无打卡记录的天（仅导入/手动记录）原样保留，不破坏。
function rebuildIntake(){
  const fresh = {};
  const histDays = new Set();
  state.stack.forEach(s=>{
    if(!s.history) return;
    Object.keys(s.history).forEach(d=>{ if((s.history[d]||0)>0) histDays.add(d); });
  });
  state.stack.forEach(s=>{
    if(!s.history) return;
    (s.ings||[]).forEach(g=>{
      if(!g || !g.name || !(g.amt>0)) return;
      const per = g.amt*(s.dose||1);
      Object.keys(s.history).forEach(d=>{
        const cnt = s.history[d]||0; if(cnt<=0) return;
        if(!fresh[d]) fresh[d]={};
        fresh[d][g.name]=(fresh[d][g.name]||0)+per*cnt;
      });
    });
  });
  const old = state.intake||{};
  Object.keys(old).forEach(d=>{ if(!histDays.has(d)) fresh[d]=old[d]; });
  state.intake = fresh;
}
function remove(uid){state.stack=state.stack.filter(x=>x.uid!==uid);save();closeSheet();viewStack();}
function archive(uid){ const s=state.stack.find(x=>x.uid===uid); if(!s) return; s.archived=true; save(); closeSheet(); toast(t("toBox")); viewStack(); }
function unarchive(uid){ const s=state.stack.find(x=>x.uid===uid); if(!s) return; s.archived=false; save(); viewBox(); }
function removeArchived(uid){ state.stack=state.stack.filter(x=>x.uid!==uid); save(); viewBox(); }
function copyStack(uid){
  const s=state.stack.find(x=>x.uid===uid); if(!s) return;
  const cp={...s}; delete cp.uid; cp.remaining=cp.serv; cp.history={}; cp._bf={}; cp.archived=false;
  closeSheet();
  openConfig(s.lib||null, null, cp);
}
function backfill(uid, taken, remain, prevRemain){
  const s=state.stack.find(x=>x.uid===uid); if(!s) return;
  if(!s._bf) s._bf={};
  // 1) 先撤销上一轮补录：只扣掉「补录部分」，应用内已记录原样保留（避免重复累计）
  Object.keys(s._bf).forEach(k=>{
    const bf=s._bf[k]; if(!bf) return;
    s.history[k]=Math.max(0,(s.history[k]||0)-bf); if(s.history[k]===0) delete s.history[k];
    if(state.intake[k]){
      (s.ings||[]).forEach(g=>{ if(g&&g.name&&g.amt>0){ const nm=g.name; state.intake[k][nm]=Math.max(0,(state.intake[k][nm]||0)-g.amt*s.dose*bf); if(state.intake[k][nm]===0) delete state.intake[k][nm]; } });
      if(Object.keys(state.intake[k]).length===0) delete state.intake[k];
    }
  });
  s._bf={};
  // 2) 纯应用内已记录份数（此时 history 已不含补录）
  const inAppTaken = Object.values(s.history||{}).reduce((a,b)=>a+(+b||0),0);
  const n=Math.max(0,Math.floor(taken||0));
  const effectiveN=Math.max(n, inAppTaken);     // 应用内已服不可撤销，总数不低于已记录
  const remainV=Math.max(0,Math.floor(remain||0));
  // 3) 仅补录差额：从昨天往前填空白日，跳过应用内已有记录的日子
  let cnt=Math.max(0, effectiveN-inAppTaken);
  for(let i=1; cnt>0; i++){
    const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10);
    if(s.history[key]) continue;                // 该日已有应用内记录，跳过避免覆盖
    s.history[key]=(s.history[key]||0)+1; s._bf[key]=(s._bf[key]||0)+1;
    if(!state.intake[key]) state.intake[key]={};
    (s.ings||[]).forEach(g=>{ if(g&&g.name&&g.amt>0) state.intake[key][g.name]=((state.intake[key][g.name]||0)+g.amt*s.dose); });
    cnt--;
  }
  // 剩余 = 用户输入剩余；若用户未改动（等于打开时剩余），自动扣减补录份数
  const autoRemain = Math.max(0, (s.serv||0) - effectiveN*(s.dose||1));
  s.remaining = (remainV===prevRemain||prevRemain==null) ? autoRemain : remainV;
  s.serv = Math.max(s.serv||0, effectiveN*(s.dose||1) + s.remaining);
  save(); closeSheet(); toast(t("backfilled")); setTab(curTab);
}

async function fetchWithTimeout(url, opts={}, ms=15000){

  finally{ clearTimeout(timer); }
}

  messages.push({role:"user", content:userContent});
  const reqBody = {model:p.model||"gpt-4o-mini", messages, temperature:0.2};
  /* 推理模型（如 Agnes agnes-2.5-flash）需要关闭 thinking 才能拿到干净 content */
  if(isReasoningModel(p)){
    reqBody.chat_template_kwargs = {enable_thinking: false};
  }
  let res;
  try{
    res = await fetchWithTimeout(p.baseUrl.replace(/\/+$/,"")+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.apiKey},
      body: JSON.stringify(reqBody)
    }, 20000);
  }catch(err){ if(err && err.name==="AbortError") throw new Error(t("netTimeout")); throw err; }
  if(!res.ok) throw new Error(t("aiHttp")+res.status+"）");
  const data = await res.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  /* 推理模型可能将内容放在 reasoning_content，需兜底 */
  let text = msg ? (msg.content || "") : "";
  if(!text && msg && msg.reasoning_content) text = msg.reasoning_content;
  if(!text) throw new Error(t("aiNoResult"));
  return parseJSON(text);
}

  $("#scanWrap").classList.remove("on");
  document.documentElement.classList.remove("scanner-active","scan-locked");

async function startScan(){
  closeSheet();
  const BS = capBS();
  if(BS){
    let listener = null;
    try{
      const perm = await BS.requestPermissions();
      if(!perm || (perm.camera !== 'granted' && perm.camera !== 'limited')){
        toast(t("noCamera")); return;
      }
      openScan();
      document.documentElement.classList.add("scanner-active");
      listener = await BS.addListener('barcodesScanned', (ev) => {
        if(ev && ev.barcodes && ev.barcodes.length){
          const code = ev.barcodes[0].rawValue || ev.barcodes[0].displayValue;
          closeScan();
          if(listener && listener.remove){ try{listener.remove();}catch(e){} }
          if(code) onCode(code);
        }
      });
      await BS.startScan();
    }catch(err){
      if(listener && listener.remove){ try{listener.remove();}catch(e){} }
      closeScan();
      toast(t("noCamera"));
    }
    return;
  }
  if(!("BarcodeDetector" in window)){ toast(t("noScan")); return; }
  openScan();
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    $("#scanVideo").srcObject = scanStream;
    scanDetector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","qr_code"]});
    scanLoop();
  }catch(err){ closeScan(); toast(t("noCamera")+"："+(err.message||"")); }
}
function scanLoop(){
  if(!scanDetector) return;
  scanDetector.detect($("#scanVideo")).then(codes=>{
    if(codes && codes.length){ onCode(codes[0].rawValue); return; }
    requestAnimationFrame(scanLoop);
  }).catch(()=>requestAnimationFrame(scanLoop));
}

// 逐个源尝试拉取 version.json；每个源单独限时，避免被墙的域名把整次检查挂死
async function fetchVersionInfo(perTryMs){
  let lastErr = null;
  for(const url of UPDATE_URLS){
    const ac = typeof AbortController!=="undefined" ? new AbortController() : null;
    const timer = setTimeout(()=>{ try{ ac && ac.abort(); }catch(e){} }, perTryMs||6000);
    try{
      const res = await fetch(url, {cache:"no-store", signal: ac?ac.signal:undefined});
      if(!res.ok) throw new Error("http "+res.status);
      const info = await res.json();
      if(!info || !info.versionCode) throw new Error("bad payload");
      return info;
    }catch(err){ lastErr = err; }
    finally{ clearTimeout(timer); }
  }
  throw lastErr || new Error("no source reachable");
}

  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(data.state && data.state.stack){
          const merged = migrate(data.state);
          // 合并而非覆盖：保留现有 + 导入新的
          const existingIds = new Set(state.stack.map(s=>s.uid));
          merged.stack.forEach(s=>{ if(!existingIds.has(s.uid)) state.stack.push(s); });
          if(merged.intake){
            Object.keys(merged.intake).forEach(d=>{ if(!state.intake[d]) state.intake[d]=merged.intake[d]; });
          }
          if(data.settings) Object.assign(settings, data.settings);
          if(data.ai) setAIState(data.ai);
          save(); saveSettings(); applyTheme(); applyLang();
          toast(t("importSuccess")); closeSheet(); setTab("today");
        } else {
          toast(t("importFail"));
        }
      }catch(err){ toast(t("importFail")); }
    };
    reader.readAsText(f);
  };
  input.click();
}

/* 背景光斑滚动视差（增强液态纵深） */
(function(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(document.documentElement.classList.contains("no-glass") || /Android/i.test(navigator.userAgent||"")) return; // 关闭玻璃/安卓下不做背景球视差，省合成
  const orbs = document.querySelectorAll(".bg-orbs i");
  if(!orbs.length) return;
  const factors = [.12,.08,.16,.06,.1];
  let ticking=false;
  function update(){
    const y = window.scrollY || window.pageYOffset || 0;
    orbs.forEach((o,i)=>{ o.style.transform = "translate3d(0,"+(y*(factors[i%factors.length])).toFixed(1)+"px,0)"; });
    ticking=false;
  }
  window.addEventListener("scroll", ()=>{ if(!ticking){ ticking=true; requestAnimationFrame(update); } }, {passive:true});
})();
</script>
