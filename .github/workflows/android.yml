name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: mkdir -p www && cp index.html www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      # ABI 拆分后每个架构一个 APK（app-<abi>-release.apk），用 glob 收集，不再写死单文件路径
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaichiyao-release
          path: android/app/build/outputs/apk/release/app-*-release.apk
          if-no-files-found: error

      # 注意：这一步必须永不失败。首次构建时 latest release/tag 并不存在，
      # 旧写法 REL_ID=$(curl ... | grep ...) 在 grep 无匹配时返回 1，
      # 而 Actions 默认 shell 是 bash -e，赋值语句的非零退出码会直接中断整步，
      # 导致后面的「发布 release」被 skip → release 永远建不出来 → 下次仍失败（死锁）。
      - name: Remove previous 'latest' release/tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" \
            | jq -r '.id // empty')
          echo "existing latest release id: ${REL_ID:-<none>}"
          if [ -n "$REL_ID" ]; then
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID"
            echo "deleted release $REL_ID"
          fi
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest"
          echo "tag cleanup done"
          exit 0

      - name: Publish 'latest' release (APK + version.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          prerelease: false
          name: 最新版
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/app-*-release.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
