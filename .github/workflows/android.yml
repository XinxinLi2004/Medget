name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: mkdir -p www && cp index.html www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK (signed)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaichiyao-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove previous 'latest' release/tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" \
            | grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*')
          if [ -n "$REL_ID" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID"
          fi
          curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest" || true

      - name: Publish 'latest' release (APK + version.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          name: 最新版（预发布）
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
